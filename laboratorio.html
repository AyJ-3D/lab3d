<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab 3D — Panel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg: #080808;
  --card: #111;
  --border: #1e1e1e;
  --text: #e8e8e0;
  --muted: #444;
  --accent: #ff6b2b;
  --green: #27ae60;
  --yellow: #f39c12;
  --red: #c0392b;
  --blue: #2980b9;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* TOP BAR */
#top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.top-left { display: flex; align-items: center; gap: 12px; }
.logo-big {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--accent), #ffb347);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
#top-bar h1 { font-size: 20px; font-weight: 700; }
#top-bar .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

.top-right { display: flex; align-items: center; gap: 24px; }
#clock {
  font-family: 'DM Mono', monospace;
  font-size: 26px;
  font-weight: 500;
  letter-spacing: .04em;
}
#date-str { font-size: 12px; color: var(--muted); text-align: right; margin-top: 1px; }

.live-dot { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.dot-pulse {
  width: 8px; height: 8px;
  background: var(--green);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { opacity:1; box-shadow: 0 0 0 0 rgba(39,174,96,.4); }
  50%      { opacity:.8; box-shadow: 0 0 0 6px rgba(39,174,96,0); }
}

/* STATS */
#stats-bar {
  display: flex;
  gap: 1px;
  background: var(--border);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.stat-box {
  flex: 1;
  background: var(--bg);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.stat-icon { font-size: 18px; }
.stat-num  { font-size: 24px; font-weight: 800; line-height: 1; }
.stat-lbl  { font-size: 10px; color: var(--muted); margin-top: 2px; letter-spacing: .06em; text-transform: uppercase; }
.stat-box.pend .stat-num { color: var(--yellow); }
.stat-box.proc .stat-num { color: var(--blue); }
.stat-box.list .stat-num { color: var(--green); }

/* COLUMNS */
#columns {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 1px;
  background: var(--border);
  flex: 1;
  overflow: hidden;
}

.column {
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.col-header {
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 9px;
  flex-shrink: 0;
}
.col-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.col-dot.pendiente { background: var(--yellow); }
.col-dot.proceso   { background: var(--blue); }
.col-dot.listo     { background: var(--green); }
.col-title { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.col-count { margin-left: auto; font-size: 12px; color: var(--muted); }

.col-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.col-body::-webkit-scrollbar { width: 3px; }
.col-body::-webkit-scrollbar-thumb { background: var(--border); }

/* TASK CARD */
.task-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px 14px 20px;
  position: relative;
  animation: fadeIn .25s ease;
  transition: border-color .15s;
}
.task-card:hover { border-color: #2a2a2a; }
@keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }

/* Barra de prioridad lateral */
.prio-bar {
  position: absolute;
  left: 0; top: 0;
  width: 5px; height: 100%;
  border-radius: 12px 0 0 12px;
}
.prio-bar.alta  { background: var(--red); }
.prio-bar.media { background: var(--yellow); }
.prio-bar.baja  { background: var(--green); }

/* DESCRIPCION — protagonista */
.task-desc {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.35;
  margin-bottom: 8px;
}

/* CLIENTE — secundario, pequeño */
.task-cliente {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.task-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}

.chip {
  font-size: 11px;
  color: #888;
  background: #161616;
  border: 1px solid #1e1e1e;
  border-radius: 6px;
  padding: 3px 8px;
}
.chip.prio-alta  { color: #e74c3c; background: rgba(192,57,45,.1);  border-color: rgba(192,57,45,.2); }
.chip.prio-media { color: #f39c12; background: rgba(243,156,18,.1); border-color: rgba(243,156,18,.2); }
.chip.prio-baja  { color: #27ae60; background: rgba(39,174,96,.1);  border-color: rgba(39,174,96,.2); }

.task-notas {
  font-size: 12px;
  color: #3a5a4a;
  font-style: italic;
  margin-bottom: 10px;
  line-height: 1.4;
  border-left: 2px solid #1a3a2a;
  padding-left: 8px;
}

.task-actions {
  display: flex;
  gap: 6px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.act-btn {
  flex: 1;
  padding: 7px 4px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #0a0a0a;
  color: var(--muted);
  font-size: 11px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  text-align: center;
}
.act-btn:hover { border-color: #333; color: var(--text); }
.act-btn.iniciar { border-color: var(--blue);  color: var(--blue);  background: rgba(41,128,185,.08); }
.act-btn.listo   { border-color: var(--green); color: var(--green); background: rgba(39,174,96,.08); }
.act-btn.del:hover { border-color: var(--red); color: var(--red); background: rgba(192,57,45,.08); }

.empty-col {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #1a1a1a;
  font-size: 12px;
  letter-spacing: .12em;
  text-transform: uppercase;
}
</style>
</head>
<body>

<div id="top-bar">
  <div class="top-left">
    <div class="logo-big">🖨️</div>
    <div>
      <h1>Laboratorio 3D — AyJ</h1>
      <div class="sub">Panel de producción</div>
    </div>
  </div>
  <div class="top-right">
    <div class="live-dot"><div class="dot-pulse"></div>En vivo</div>
    <div>
      <div id="clock">00:00:00</div>
      <div id="date-str">—</div>
    </div>
  </div>
</div>

<div id="stats-bar">
  <div class="stat-box pend">
    <div class="stat-icon">⏳</div>
    <div><div class="stat-num" id="cnt-pend">0</div><div class="stat-lbl">Pendientes</div></div>
  </div>
  <div class="stat-box proc">
    <div class="stat-icon">⚙️</div>
    <div><div class="stat-num" id="cnt-proc">0</div><div class="stat-lbl">En proceso</div></div>
  </div>
  <div class="stat-box list">
    <div class="stat-icon">✅</div>
    <div><div class="stat-num" id="cnt-list">0</div><div class="stat-lbl">Listos</div></div>
  </div>
  <div class="stat-box">
    <div class="stat-icon">📋</div>
    <div><div class="stat-num" id="cnt-tot">0</div><div class="stat-lbl">Total</div></div>
  </div>
</div>

<div id="columns">
  <div class="column">
    <div class="col-header">
      <div class="col-dot pendiente"></div>
      <span class="col-title">Pendientes</span>
      <span class="col-count" id="lbl-pend">0</span>
    </div>
    <div class="col-body" id="col-pendiente"></div>
  </div>
  <div class="column">
    <div class="col-header">
      <div class="col-dot proceso"></div>
      <span class="col-title">En Proceso</span>
      <span class="col-count" id="lbl-proc">0</span>
    </div>
    <div class="col-body" id="col-proceso"></div>
  </div>
  <div class="column">
    <div class="col-header">
      <div class="col-dot listo"></div>
      <span class="col-title">Listos</span>
      <span class="col-count" id="lbl-list">0</span>
    </div>
    <div class="col-body" id="col-listo"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const FIREBASE = {
  apiKey: "AIzaSyBXavijHTHupygKx0Az-NtVbyn5k9c6t2o",
  authDomain: "ayj-3d.firebaseapp.com",
  databaseURL: "https://ayj-3d-default-rtdb.firebaseio.com",
  projectId: "ayj-3d",
  storageBucket: "ayj-3d.firebasestorage.app",
  messagingSenderId: "683028999015",
  appId: "1:683028999015:web:1ea776a9c9f71eb523ddc2"
};

const fbApp = initializeApp(FIREBASE);
const db    = getDatabase(fbApp);

// RELOJ
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('es-AR', { hour12: false });
  document.getElementById('date-str').textContent =
    now.toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' });
}
updateClock();
setInterval(updateClock, 1000);

function prioChip(p) {
  const labels = { alta:'🔴 Alta', media:'🟡 Media', baja:'🟢 Baja' };
  return `<span class="chip prio-${p}">${labels[p]||p}</span>`;
}

function renderCard(id, t) {
  const notas = t.notas && t.notas.trim() !== '' && t.notas !== '—'
    ? `<div class="task-notas">📝 ${t.notas}</div>` : '';

  const cantidad = t.cantidad && t.cantidad !== '1' && t.cantidad !== ''
    ? `<span class="chip">✕${t.cantidad}</span>` : '';

  let actions = '';
  if (t.estado === 'pendiente') {
    actions = `
      <button class="act-btn iniciar" onclick="cambiarEstado('${id}','proceso')">▶ Iniciar</button>
      <button class="act-btn del"     onclick="eliminar('${id}')">✕</button>`;
  } else if (t.estado === 'proceso') {
    actions = `
      <button class="act-btn listo" onclick="cambiarEstado('${id}','listo')">✓ Listo</button>
      <button class="act-btn del"   onclick="eliminar('${id}')">✕</button>`;
  } else {
    actions = `<button class="act-btn del" onclick="eliminar('${id}')">✕ Archivar</button>`;
  }

  return `
    <div class="task-card" id="card-${id}">
      <div class="prio-bar ${t.prioridad||'baja'}"></div>

      <div class="task-desc">${t.descripcion || 'Sin descripción'}</div>

      <div class="task-cliente">👤 ${t.cliente || 'Sin nombre'} · 📅 ${t.creado || '—'}</div>

      <div class="task-meta">
        ${prioChip(t.prioridad||'baja')}
        <span class="chip">🧱 ${t.material||'PLA'}</span>
        <span class="chip">🎨 ${t.color||'—'}</span>
        ${cantidad}
        <span class="chip">⏱ ${t.tiempo||'—'}</span>
      </div>

      ${notas}

      <div class="task-actions">${actions}</div>
    </div>`;
}

window.cambiarEstado = function(id, estado) {
  update(ref(db, 'tareas/' + id), { estado });
};

window.eliminar = function(id) {
  if (confirm('¿Archivar esta tarea?')) remove(ref(db, 'tareas/' + id));
};

const prioOrder = { alta: 0, media: 1, baja: 2 };

onValue(ref(db, 'tareas'), (snap) => {
  const data = snap.val() || {};
  const cols = { pendiente: [], proceso: [], listo: [] };

  Object.entries(data).forEach(([id, t]) => {
    const estado = t.estado || 'pendiente';
    if (cols[estado]) cols[estado].push({ id, ...t });
  });

  Object.keys(cols).forEach(k => {
    cols[k].sort((a,b) => (prioOrder[a.prioridad]||2) - (prioOrder[b.prioridad]||2));
  });

  ['pendiente','proceso','listo'].forEach(estado => {
    const el = document.getElementById('col-' + estado);
    el.innerHTML = cols[estado].length === 0
      ? '<div class="empty-col">Sin tareas</div>'
      : cols[estado].map(t => renderCard(t.id, t)).join('');
  });

  const np = cols.pendiente.length, nr = cols.proceso.length, nl = cols.listo.length;
  document.getElementById('cnt-pend').textContent = np;
  document.getElementById('cnt-proc').textContent = nr;
  document.getElementById('cnt-list').textContent = nl;
  document.getElementById('cnt-tot').textContent  = np+nr+nl;
  document.getElementById('lbl-pend').textContent = np;
  document.getElementById('lbl-proc').textContent = nr;
  document.getElementById('lbl-list').textContent = nl;
});
</script>
</body>
</html>
