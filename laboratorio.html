<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab 3D — Panel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg: #080808;
  --card: #111;
  --border: #1e1e1e;
  --text: #e8e8e0;
  --muted: #444;
  --accent: #ff6b2b;
  --green: #27ae60;
  --yellow: #f39c12;
  --red: #c0392b;
  --blue: #2980b9;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* HEADER */
#top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 32px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.top-left { display: flex; align-items: center; gap: 14px; }

.logo-big {
  width: 48px; height: 48px;
  background: linear-gradient(135deg, var(--accent), #ffb347);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
}

#top-bar h1 { font-size: 22px; font-weight: 700; }
#top-bar .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

.top-right { display: flex; align-items: center; gap: 20px; }

#clock {
  font-family: 'DM Mono', monospace;
  font-size: 28px;
  font-weight: 500;
  color: var(--text);
  letter-spacing: .04em;
}

#date-str { font-size: 13px; color: var(--muted); text-align: right; margin-top: 2px; }

.live-dot {
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; color: var(--muted);
}
.dot-pulse {
  width: 8px; height: 8px;
  background: var(--green);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { opacity:1; box-shadow: 0 0 0 0 rgba(39,174,96,.4); }
  50%      { opacity:.8; box-shadow: 0 0 0 6px rgba(39,174,96,0); }
}

/* STATS BAR */
#stats-bar {
  display: flex;
  gap: 1px;
  background: var(--border);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.stat-box {
  flex: 1;
  background: var(--bg);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.stat-icon { font-size: 20px; }
.stat-num  { font-size: 26px; font-weight: 700; line-height: 1; }
.stat-lbl  { font-size: 11px; color: var(--muted); margin-top: 2px; letter-spacing: .06em; text-transform: uppercase; }

.stat-box.pendiente .stat-num { color: var(--yellow); }
.stat-box.proceso   .stat-num { color: var(--blue); }
.stat-box.listo     .stat-num { color: var(--green); }
.stat-box.total     .stat-num { color: var(--text); }

/* COLUMNS */
#columns {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 1px;
  background: var(--border);
  flex: 1;
  overflow: hidden;
}

.column {
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.col-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.col-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.col-dot.pendiente { background: var(--yellow); }
.col-dot.proceso   { background: var(--blue); }
.col-dot.listo     { background: var(--green); }

.col-title { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.col-count { margin-left: auto; font-size: 12px; color: var(--muted); }

.col-body {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.col-body::-webkit-scrollbar { width: 4px; }
.col-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* TASK CARD */
.task-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  animation: fadeIn .3s ease;
  cursor: pointer;
  transition: border-color .2s, transform .15s;
  position: relative;
}
.task-card:hover { border-color: #333; transform: translateY(-1px); }

@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

.task-prio {
  position: absolute;
  top: 0; left: 0;
  width: 4px;
  height: 100%;
  border-radius: 12px 0 0 12px;
}
.task-prio.alta  { background: var(--red); }
.task-prio.media { background: var(--yellow); }
.task-prio.baja  { background: var(--green); }

.task-inner { padding-left: 10px; }

.task-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}

.task-cliente {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}

.task-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 20px;
  letter-spacing: .06em;
  text-transform: uppercase;
  flex-shrink: 0;
  margin-top: 1px;
}
.badge-alta  { background: rgba(192,57,45,.2);  color: #e74c3c; border: 1px solid rgba(192,57,45,.3); }
.badge-media { background: rgba(243,156,18,.15); color: #f39c12; border: 1px solid rgba(243,156,18,.3); }
.badge-baja  { background: rgba(39,174,96,.15);  color: #27ae60; border: 1px solid rgba(39,174,96,.3); }

.task-desc {
  font-size: 13px;
  color: #aaa;
  line-height: 1.45;
  margin-bottom: 10px;
}

.task-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.meta-chip {
  font-size: 11px;
  color: var(--muted);
  background: #161616;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 8px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.task-actions {
  display: flex;
  gap: 6px;
  margin-top: 12px;
  border-top: 1px solid var(--border);
  padding-top: 10px;
}

.act-btn {
  flex: 1;
  padding: 7px 4px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #0a0a0a;
  color: var(--muted);
  font-size: 11px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  text-align: center;
}
.act-btn:hover { border-color: #444; color: var(--text); }
.act-btn.proceso { border-color: var(--blue);  color: var(--blue);  background: rgba(41,128,185,.1); }
.act-btn.listo   { border-color: var(--green); color: var(--green); background: rgba(39,174,96,.1); }
.act-btn.del     { border-color: #333; color: #444; }
.act-btn.del:hover { border-color: var(--red); color: var(--red); background: rgba(192,57,45,.1); }

.empty-col {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #1e1e1e;
  font-size: 13px;
  letter-spacing: .1em;
  text-transform: uppercase;
}

/* NOTAS tooltip */
.task-notas {
  font-size: 11px;
  color: #3a5a4a;
  font-style: italic;
  margin-top: 4px;
  margin-bottom: 8px;
  line-height: 1.4;
}
</style>
</head>
<body>

<div id="top-bar">
  <div class="top-left">
    <div class="logo-big">🖨️</div>
    <div>
      <h1>Laboratorio 3D — AyJ</h1>
      <div class="sub">Panel de producción</div>
    </div>
  </div>
  <div class="top-right">
    <div class="live-dot">
      <div class="dot-pulse"></div>
      En vivo
    </div>
    <div>
      <div id="clock">00:00:00</div>
      <div id="date-str">—</div>
    </div>
  </div>
</div>

<div id="stats-bar">
  <div class="stat-box pendiente">
    <div class="stat-icon">⏳</div>
    <div><div class="stat-num" id="cnt-pend">0</div><div class="stat-lbl">Pendientes</div></div>
  </div>
  <div class="stat-box proceso">
    <div class="stat-icon">⚙️</div>
    <div><div class="stat-num" id="cnt-proc">0</div><div class="stat-lbl">En proceso</div></div>
  </div>
  <div class="stat-box listo">
    <div class="stat-icon">✅</div>
    <div><div class="stat-num" id="cnt-list">0</div><div class="stat-lbl">Listos</div></div>
  </div>
  <div class="stat-box total">
    <div class="stat-icon">📋</div>
    <div><div class="stat-num" id="cnt-tot">0</div><div class="stat-lbl">Total hoy</div></div>
  </div>
</div>

<div id="columns">
  <div class="column">
    <div class="col-header">
      <div class="col-dot pendiente"></div>
      <span class="col-title">Pendientes</span>
      <span class="col-count" id="lbl-pend">0</span>
    </div>
    <div class="col-body" id="col-pendiente"></div>
  </div>
  <div class="column">
    <div class="col-header">
      <div class="col-dot proceso"></div>
      <span class="col-title">En Proceso</span>
      <span class="col-count" id="lbl-proc">0</span>
    </div>
    <div class="col-body" id="col-proceso"></div>
  </div>
  <div class="column">
    <div class="col-header">
      <div class="col-dot listo"></div>
      <span class="col-title">Listos</span>
      <span class="col-count" id="lbl-list">0</span>
    </div>
    <div class="col-body" id="col-listo"></div>
  </div>
</div>

<script type="module">
import { initializeApp }                          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const FIREBASE = {
  apiKey: "AIzaSyBXavijHTHupygKx0Az-NtVbyn5k9c6t2o",
  authDomain: "ayj-3d.firebaseapp.com",
  databaseURL: "https://ayj-3d-default-rtdb.firebaseio.com",
  projectId: "ayj-3d",
  storageBucket: "ayj-3d.firebasestorage.app",
  messagingSenderId: "683028999015",
  appId: "1:683028999015:web:1ea776a9c9f71eb523ddc2"
};

const fbApp = initializeApp(FIREBASE);
const db    = getDatabase(fbApp);

// ── RELOJ ──────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('es-AR', { hour12: false });
  document.getElementById('date-str').textContent =
    now.toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' });
}
updateClock();
setInterval(updateClock, 1000);

// ── RENDER ─────────────────────────────────────────────────────────
function prioLabel(p) {
  if (p === 'alta')  return '<span class="task-badge badge-alta">Alta</span>';
  if (p === 'media') return '<span class="task-badge badge-media">Media</span>';
  return '<span class="task-badge badge-baja">Baja</span>';
}

function renderCard(id, t) {
  const notas = t.notas && t.notas !== '—' && t.notas !== ''
    ? `<div class="task-notas">📝 ${t.notas}</div>` : '';

  let actions = '';
  if (t.estado === 'pendiente') {
    actions = `
      <button class="act-btn proceso" onclick="cambiarEstado('${id}','proceso')">▶ Iniciar</button>
      <button class="act-btn del"     onclick="eliminarTarea('${id}')">✕</button>`;
  } else if (t.estado === 'proceso') {
    actions = `
      <button class="act-btn listo"   onclick="cambiarEstado('${id}','listo')">✓ Listo</button>
      <button class="act-btn del"     onclick="eliminarTarea('${id}')">✕</button>`;
  } else {
    actions = `
      <button class="act-btn del"     onclick="eliminarTarea('${id}')">✕ Archivar</button>`;
  }

  return `
    <div class="task-card" id="card-${id}">
      <div class="task-prio ${t.prioridad || 'baja'}"></div>
      <div class="task-inner">
        <div class="task-top">
          <div class="task-cliente">${t.cliente || 'Sin nombre'}</div>
          ${prioLabel(t.prioridad)}
        </div>
        <div class="task-desc">${t.descripcion || '—'}</div>
        ${notas}
        <div class="task-meta">
          <div class="meta-chip">🎨 ${t.color || '—'}</div>
          <div class="meta-chip">🧱 ${t.material || 'PLA'}</div>
          <div class="meta-chip">⏱ ${t.tiempo || '—'}</div>
          <div class="meta-chip">📅 ${t.creado || '—'}</div>
        </div>
        <div class="task-actions">${actions}</div>
      </div>
    </div>`;
}

window.cambiarEstado = function(id, nuevoEstado) {
  update(ref(db, 'tareas/' + id), { estado: nuevoEstado });
};

window.eliminarTarea = function(id) {
  if (confirm('¿Archivar esta tarea?')) {
    remove(ref(db, 'tareas/' + id));
  }
};

// ── ESCUCHAR FIREBASE EN TIEMPO REAL ──────────────────────────────
onValue(ref(db, 'tareas'), (snapshot) => {
  const data = snapshot.val() || {};

  const cols = { pendiente: [], proceso: [], listo: [] };

  Object.entries(data).forEach(([id, t]) => {
    const estado = t.estado || 'pendiente';
    if (cols[estado]) cols[estado].push({ id, ...t });
  });

  // Ordenar por prioridad: alta > media > baja
  const prioOrder = { alta: 0, media: 1, baja: 2 };
  Object.keys(cols).forEach(k => {
    cols[k].sort((a,b) => (prioOrder[a.prioridad]||2) - (prioOrder[b.prioridad]||2));
  });

  // Render columnas
  ['pendiente','proceso','listo'].forEach(estado => {
    const el = document.getElementById('col-' + estado);
    if (cols[estado].length === 0) {
      el.innerHTML = '<div class="empty-col">Sin tareas</div>';
    } else {
      el.innerHTML = cols[estado].map(t => renderCard(t.id, t)).join('');
    }
  });

  // Stats
  const np = cols.pendiente.length;
  const nr = cols.proceso.length;
  const nl = cols.listo.length;
  const tot = np + nr + nl;

  document.getElementById('cnt-pend').textContent = np;
  document.getElementById('cnt-proc').textContent = nr;
  document.getElementById('cnt-list').textContent = nl;
  document.getElementById('cnt-tot').textContent  = tot;
  document.getElementById('lbl-pend').textContent = np;
  document.getElementById('lbl-proc').textContent = nr;
  document.getElementById('lbl-list').textContent = nl;
});
</script>
</body>
</html>
