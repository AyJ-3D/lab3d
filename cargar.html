<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lab 3D — Cargar Pedido</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');

:root {
  --bg: #0c0c0c;
  --card: #161616;
  --border: #252525;
  --accent: #ff6b2b;
  --accent2: #ffb347;
  --text: #f0f0f0;
  --muted: #555;
  --green: #27ae60;
  --yellow: #f39c12;
  --red: #c0392b;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  padding: 20px 16px 60px;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 22px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--border);
}

.logo {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}

header h1 { font-size: 19px; font-weight: 700; }
header p  { font-size: 12px; color: var(--muted); margin-top: 2px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
}

.card-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-title .num {
  background: var(--accent);
  color: #fff;
  width: 20px; height: 20px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
}

textarea, input, select {
  width: 100%;
  background: #0a0a0a;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  padding: 12px 14px;
  outline: none;
  transition: border-color .2s;
  -webkit-appearance: none;
  appearance: none;
}
textarea { resize: none; height: 110px; line-height: 1.5; }
textarea::placeholder, input::placeholder { color: var(--muted); }
textarea:focus, input:focus, select:focus { border-color: var(--accent); }
input.ai-filled, textarea.ai-filled, select.ai-filled {
  border-color: #1a3a2a;
  background: #0a110d;
}

.field-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 7px;
  margin-top: 14px;
}
.field-label:first-of-type { margin-top: 0; }

.ai-badge {
  font-size: 10px;
  color: #2a7a4a;
  background: #0a1a10;
  border: 1px solid #1a3a2a;
  border-radius: 10px;
  padding: 2px 7px;
  display: none;
}

.btn-ai {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
  border-radius: 10px;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .2s;
}
.btn-ai:disabled { opacity: .45; cursor: not-allowed; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.prio-row { display: flex; gap: 8px; }
.prio-btn {
  flex: 1;
  padding: 12px 4px;
  border-radius: 10px;
  border: 2px solid var(--border);
  background: #0a0a0a;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  text-align: center;
  line-height: 1.4;
}
.prio-btn.sel-alta   { border-color: var(--red);    background: #1a0808; color: #e74c3c; }
.prio-btn.sel-media  { border-color: var(--yellow);  background: #1a1500; color: #f39c12; }
.prio-btn.sel-baja   { border-color: var(--green);   background: #081a10; color: #27ae60; }

.btn-save {
  width: 100%;
  margin-top: 6px;
  padding: 17px;
  background: var(--green);
  border: none;
  border-radius: 14px;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .2s;
}
.btn-save:disabled { opacity: .45; cursor: not-allowed; }

.toast {
  position: fixed;
  bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--green);
  color: #fff;
  font-weight: 700;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 15px;
  opacity: 0;
  transition: all .3s;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
  box-shadow: 0 8px 32px rgba(0,0,0,.5);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err  { background: var(--red); }

.spin {
  display: inline-block;
  width: 15px; height: 15px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: sp .6s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes sp { to { transform: rotate(360deg); } }

#form-section { display: none; }
select option { background: #1a1a1a; }
</style>
</head>
<body>

<header>
  <div class="logo">🖨️</div>
  <div>
    <h1>Lab 3D — AyJ</h1>
    <p>Cargar nuevo pedido</p>
  </div>
</header>

<div class="card">
  <div class="card-title"><span class="num">1</span> Pegá el mensaje del cliente</div>
  <textarea id="mensaje" placeholder="Pegá acá el mensaje de WhatsApp o Instagram tal cual lo recibiste..."></textarea>
  <button class="btn-ai" id="btn-ai" onclick="analizarMensaje()">✨ Analizar con IA</button>
</div>

<div id="form-section">
  <div class="card">
    <div class="card-title"><span class="num">2</span> Revisá y editá los datos</div>

    <label class="field-label">
      Cliente / Nombre
      <span class="ai-badge" id="badge-cliente">✓ IA</span>
    </label>
    <input type="text" id="f-cliente" placeholder="Nombre del cliente">

    <label class="field-label">
      Descripción del trabajo
      <span class="ai-badge" id="badge-desc">✓ IA</span>
    </label>
    <textarea id="f-desc" style="height:80px" placeholder="Qué hay que imprimir"></textarea>

    <div class="two-col" style="margin-top:14px">
      <div>
        <label class="field-label">
          Material
          <span class="ai-badge" id="badge-mat">✓ IA</span>
        </label>
        <select id="f-material">
          <option value="PLA">PLA</option>
          <option value="PETG">PETG</option>
          <option value="ABS">ABS</option>
          <option value="TPU">TPU</option>
          <option value="ASA">ASA</option>
          <option value="Resina">Resina</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <div>
        <label class="field-label">
          Color
          <span class="ai-badge" id="badge-color">✓ IA</span>
        </label>
        <input type="text" id="f-color" placeholder="ej: Negro...">
      </div>
    </div>

    <div class="two-col" style="margin-top:14px">
      <div>
        <label class="field-label">
          Cantidad
          <span class="ai-badge" id="badge-cant">✓ IA</span>
        </label>
        <input type="text" id="f-cantidad" placeholder="ej: 1, 4 piezas...">
      </div>
      <div>
        <label class="field-label">
          Tiempo estimado
          <span class="ai-badge" id="badge-tiempo">✓ IA</span>
        </label>
        <input type="text" id="f-tiempo" placeholder="ej: 2 horas...">
      </div>
    </div>

    <label class="field-label" style="margin-top:14px">
      Notas adicionales
      <span class="ai-badge" id="badge-notas">✓ IA</span>
    </label>
    <input type="text" id="f-notas" placeholder="Medidas, tolerancias, urgencia, etc.">

    <label class="field-label" style="margin-top:14px">Prioridad</label>
    <div class="prio-row">
      <button class="prio-btn" id="prio-alta"  onclick="setPrio('alta')">🔴<br>Alta</button>
      <button class="prio-btn" id="prio-media" onclick="setPrio('media')">🟡<br>Media</button>
      <button class="prio-btn" id="prio-baja"  onclick="setPrio('baja')">🟢<br>Baja</button>
    </div>
  </div>

  <button class="btn-save" id="btn-save" onclick="guardarTarea()">✅ Guardar pedido</button>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const FIREBASE = {
  apiKey: "AIzaSyBXavijHTHupygKx0Az-NtVbyn5k9c6t2o",
  authDomain: "ayj-3d.firebaseapp.com",
  databaseURL: "https://ayj-3d-default-rtdb.firebaseio.com",
  projectId: "ayj-3d",
  storageBucket: "ayj-3d.firebasestorage.app",
  messagingSenderId: "683028999015",
  appId: "1:683028999015:web:1ea776a9c9f71eb523ddc2"
};

// URL correcta de Gemini 2.0 Flash (gratuito)
const GEMINI_KEY = "AIzaSyAnBSz_VMiplVxByaoDltikhTIaoGDIF18";
const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${GEMINI_KEY}`;

const fbApp = initializeApp(FIREBASE);
const db    = getDatabase(fbApp);

let prioSel = 'media';

function toast(msg, err=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  setTimeout(() => t.className = 'toast', 3500);
}

window.setPrio = function(p) {
  prioSel = p;
  ['alta','media','baja'].forEach(x => {
    document.getElementById('prio-'+x).className = 'prio-btn' + (x===p ? ' sel-'+x : '');
  });
};
setPrio('media');

function fillField(id, value, badgeId) {
  if (!value || value.trim() === '' || value === '—') return;
  const el = document.getElementById(id);
  el.value = value;
  el.classList.add('ai-filled');
  if (badgeId) document.getElementById(badgeId).style.display = 'inline';
}

window.analizarMensaje = async function() {
  const msg = document.getElementById('mensaje').value.trim();
  if (!msg) { toast('Pegá un mensaje primero', true); return; }

  const btn = document.getElementById('btn-ai');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Analizando...';

  const prompt = `Sos un asistente de un laboratorio de impresión 3D en Argentina. Analizá este mensaje de un cliente y extraé toda la información posible.

Mensaje: "${msg}"

Respondé ÚNICAMENTE con JSON válido, sin markdown, sin bloques de código, sin texto extra antes o después. Si no podés determinar un valor dejá cadena vacía "":

{
  "cliente": "nombre o apodo del cliente, vacío si no aparece",
  "descripcion": "descripción clara y detallada de qué hay que imprimir, en español",
  "material": "PLA o PETG o ABS o TPU o ASA o Resina o Otro — por defecto PLA",
  "color": "color del filamento si lo menciona, vacío si no",
  "cantidad": "cantidad de piezas si la menciona, vacío si no",
  "tiempo": "tiempo o fecha límite si lo menciona, vacío si no",
  "notas": "detalles técnicos importantes: medidas, acabado, urgencia, referencias",
  "prioridad": "alta o media o baja — inferí según urgencia, por defecto media"
}`;

  try {
    const res = await fetch(GEMINI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.1, maxOutputTokens: 500 }
      })
    });

    if (!res.ok) {
      const errData = await res.json();
      throw new Error(errData?.error?.message || 'Error ' + res.status);
    }

    const data = await res.json();
    let raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
    // limpiar cualquier markdown que el modelo agregue
    raw = raw.replace(/```json/g,'').replace(/```/g,'').trim();
    const d = JSON.parse(raw);

    fillField('f-cliente',  d.cliente,     'badge-cliente');
    fillField('f-desc',     d.descripcion, 'badge-desc');
    fillField('f-color',    d.color,       'badge-color');
    fillField('f-cantidad', d.cantidad,    'badge-cant');
    fillField('f-tiempo',   d.tiempo,      'badge-tiempo');
    fillField('f-notas',    d.notas,       'badge-notas');

    if (d.material) {
      const sel = document.getElementById('f-material');
      const match = Array.from(sel.options).find(o =>
        o.value.toLowerCase() === d.material.toLowerCase()
      );
      if (match) {
        sel.value = match.value;
        sel.classList.add('ai-filled');
        document.getElementById('badge-mat').style.display = 'inline';
      }
    }

    if (d.prioridad && ['alta','media','baja'].includes(d.prioridad)) {
      setPrio(d.prioridad);
    }

    document.getElementById('form-section').style.display = 'block';
    setTimeout(() => {
      document.getElementById('form-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
    toast('✓ Campos completados — editá lo que necesites');

  } catch(e) {
    console.error('Gemini error:', e);
    document.getElementById('form-section').style.display = 'block';
    toast('Error IA: ' + e.message + ' — completá los campos manualmente', true);
  }

  btn.disabled = false;
  btn.innerHTML = '✨ Analizar de nuevo';
};

window.guardarTarea = async function() {
  const desc = document.getElementById('f-desc').value.trim();
  if (!desc) { toast('Completá la descripción del trabajo', true); return; }

  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  const tarea = {
    cliente:     document.getElementById('f-cliente').value.trim()  || 'Sin nombre',
    descripcion: desc,
    material:    document.getElementById('f-material').value,
    color:       document.getElementById('f-color').value.trim()    || 'Sin especificar',
    cantidad:    document.getElementById('f-cantidad').value.trim() || '1',
    tiempo:      document.getElementById('f-tiempo').value.trim()   || 'Sin especificar',
    notas:       document.getElementById('f-notas').value.trim()    || '',
    prioridad:   prioSel,
    estado:      'pendiente',
    creado:      new Date().toLocaleString('es-AR', {
      day:'2-digit', month:'2-digit', year:'numeric',
      hour:'2-digit', minute:'2-digit'
    }),
    ts: serverTimestamp()
  };

  try {
    await push(ref(db, 'tareas'), tarea);
    toast('✅ Pedido guardado en el laboratorio');
    setTimeout(() => {
      ['mensaje','f-cliente','f-desc','f-color','f-cantidad','f-tiempo','f-notas'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('f-material').value = 'PLA';
      document.getElementById('form-section').style.display = 'none';
      document.getElementById('btn-ai').innerHTML = '✨ Analizar con IA';
      document.querySelectorAll('.ai-filled').forEach(el => el.classList.remove('ai-filled'));
      document.querySelectorAll('.ai-badge').forEach(el => el.style.display = 'none');
      setPrio('media');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 2000);
  } catch(e) {
    toast('Error al guardar: ' + e.message, true);
  }

  btn.disabled = false;
  btn.textContent = '✅ Guardar pedido';
};
</script>
</body>
</html>
