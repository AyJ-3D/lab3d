<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lab 3D — Cargar Pedido</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap');

:root {
  --bg: #0c0c0c;
  --card: #161616;
  --border: #252525;
  --accent: #ff6b2b;
  --accent2: #ffb347;
  --text: #f0f0f0;
  --muted: #555;
  --green: #27ae60;
  --yellow: #f39c12;
  --red: #c0392b;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  padding: 20px 16px 60px;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.logo {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}

header h1 { font-size: 19px; font-weight: 700; line-height: 1.2; }
header p  { font-size: 12px; color: var(--muted); margin-top: 2px; }

.step {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
}

.step-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.step-title span {
  background: var(--accent);
  color: #fff;
  width: 20px; height: 20px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
}

textarea, input, select {
  width: 100%;
  background: #0a0a0a;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  padding: 13px 14px;
  outline: none;
  transition: border-color .2s;
  -webkit-appearance: none;
  appearance: none;
}
textarea { resize: none; height: 110px; line-height: 1.5; }
textarea::placeholder, input::placeholder { color: var(--muted); }
textarea:focus, input:focus { border-color: var(--accent); }

.btn-ai {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
  border-radius: 10px;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .2s;
  letter-spacing: .02em;
}
.btn-ai:disabled { opacity: .45; cursor: not-allowed; }

.parsed-result {
  margin-top: 14px;
  background: #0a0a0a;
  border: 1px solid #1a3a2a;
  border-radius: 10px;
  padding: 14px;
  display: none;
}
.parsed-result.show { display: block; }

.pr-row {
  display: flex;
  gap: 10px;
  margin-bottom: 8px;
  font-size: 14px;
  line-height: 1.4;
}
.pr-row:last-child { margin-bottom: 0; }
.pr-key { color: var(--muted); flex-shrink: 0; min-width: 80px; }
.pr-val { color: var(--text); font-weight: 500; }

.field-label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 8px;
  margin-top: 16px;
  letter-spacing: .04em;
}
.field-label:first-child { margin-top: 0; }

.prio-row { display: flex; gap: 8px; }
.prio-btn {
  flex: 1;
  padding: 13px 4px;
  border-radius: 10px;
  border: 2px solid var(--border);
  background: #0a0a0a;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  text-align: center;
  line-height: 1.3;
}
.prio-btn.sel-alta   { border-color: var(--red);    background: #1a0808; color: #e74c3c; }
.prio-btn.sel-media  { border-color: var(--yellow);  background: #1a1500; color: #f39c12; }
.prio-btn.sel-baja   { border-color: var(--green);   background: #081a10; color: #27ae60; }

.btn-save {
  width: 100%;
  margin-top: 20px;
  padding: 17px;
  background: var(--green);
  border: none;
  border-radius: 14px;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .2s;
  display: none;
  letter-spacing: .02em;
}
.btn-save.show { display: block; }
.btn-save:disabled { opacity: .45; cursor: not-allowed; }

.toast {
  position: fixed;
  bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--green);
  color: #fff;
  font-weight: 700;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 15px;
  opacity: 0;
  transition: all .3s;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--red); }

.spin {
  display: inline-block;
  width: 15px; height: 15px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: sp .6s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes sp { to { transform: rotate(360deg); } }

#step2 { display: none; }
</style>
</head>
<body>

<header>
  <div class="logo">🖨️</div>
  <div>
    <h1>Lab 3D — AyJ</h1>
    <p>Cargar nuevo pedido</p>
  </div>
</header>

<!-- PASO 1 -->
<div class="step">
  <div class="step-title"><span>1</span> Pegá el mensaje del cliente</div>
  <textarea id="mensaje" placeholder="Pegá acá el mensaje de WhatsApp o Instagram tal cual lo recibiste..."></textarea>
  <button class="btn-ai" id="btn-ai" onclick="analizarMensaje()">✨ Analizar con IA</button>
  <div class="parsed-result" id="parsed-result">
    <div class="pr-row"><span class="pr-key">Cliente</span><span class="pr-val" id="p-cliente">—</span></div>
    <div class="pr-row"><span class="pr-key">Trabajo</span><span class="pr-val" id="p-desc">—</span></div>
    <div class="pr-row"><span class="pr-key">Material</span><span class="pr-val" id="p-mat">—</span></div>
    <div class="pr-row"><span class="pr-key">Notas</span><span class="pr-val" id="p-notas">—</span></div>
  </div>
</div>

<!-- PASO 2 -->
<div class="step" id="step2">
  <div class="step-title"><span>2</span> Completá los detalles</div>

  <label class="field-label">Color del filamento</label>
  <input type="text" id="color" placeholder="ej: Negro, Blanco, Gris...">

  <label class="field-label">Tiempo estimado</label>
  <input type="text" id="tiempo" placeholder="ej: 2 horas, 1 día...">

  <label class="field-label">Prioridad</label>
  <div class="prio-row">
    <button class="prio-btn" id="prio-alta"  onclick="setPrio('alta')">🔴<br>Alta</button>
    <button class="prio-btn" id="prio-media" onclick="setPrio('media')">🟡<br>Media</button>
    <button class="prio-btn" id="prio-baja"  onclick="setPrio('baja')">🟢<br>Baja</button>
  </div>
</div>

<button class="btn-save" id="btn-save" onclick="guardarTarea()">✅ Guardar pedido</button>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const FIREBASE = {
  apiKey: "AIzaSyBXavijHTHupygKx0Az-NtVbyn5k9c6t2o",
  authDomain: "ayj-3d.firebaseapp.com",
  databaseURL: "https://ayj-3d-default-rtdb.firebaseio.com",
  projectId: "ayj-3d",
  storageBucket: "ayj-3d.firebasestorage.app",
  messagingSenderId: "683028999015",
  appId: "1:683028999015:web:1ea776a9c9f71eb523ddc2"
};

const GEMINI_KEY = "AIzaSyCgI7oqPSAD4rCykfzD1fZdFd71OhgD_HE";
const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`;

const fbApp = initializeApp(FIREBASE);
const db    = getDatabase(fbApp);

let datosParsed = {};
let prioSel     = '';

function toast(msg, err=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  setTimeout(() => t.className = 'toast', 3000);
}

window.setPrio = function(p) {
  prioSel = p;
  ['alta','media','baja'].forEach(x => {
    document.getElementById('prio-'+x).className = 'prio-btn' + (x===p ? ' sel-'+x : '');
  });
  document.getElementById('btn-save').classList.add('show');
};

window.analizarMensaje = async function() {
  const msg = document.getElementById('mensaje').value.trim();
  if (!msg) { toast('Pegá un mensaje primero', true); return; }

  const btn = document.getElementById('btn-ai');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Analizando...';

  const prompt = `Sos un asistente de un laboratorio de impresión 3D. Analizá este mensaje de un cliente y extraé la información.

Mensaje: "${msg}"

Respondé ÚNICAMENTE con un objeto JSON válido, sin markdown, sin explicaciones:
{
  "cliente": "nombre del cliente o Desconocido si no aparece",
  "descripcion": "qué quiere imprimir, descripción clara y concisa en español",
  "material": "material mencionado o PLA si no menciona",
  "notas": "cualquier detalle adicional como medidas, cantidad, urgencia, o vacío si no hay"
}`;

  try {
    const res = await fetch(GEMINI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.1, maxOutputTokens: 300 }
      })
    });

    const data = await res.json();
    let raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
    raw = raw.replace(/```json|```/g, '').trim();
    datosParsed = JSON.parse(raw);

    document.getElementById('p-cliente').textContent = datosParsed.cliente || '—';
    document.getElementById('p-desc').textContent    = datosParsed.descripcion || '—';
    document.getElementById('p-mat').textContent     = datosParsed.material || '—';
    document.getElementById('p-notas').textContent   = datosParsed.notas || '—';

    document.getElementById('parsed-result').classList.add('show');
    document.getElementById('step2').style.display = 'block';
    document.getElementById('step2').scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch(e) {
    toast('Error al analizar: ' + e.message, true);
    // fallback: usar el mensaje crudo
    datosParsed = { cliente: 'Desconocido', descripcion: msg, material: 'PLA', notas: '' };
    document.getElementById('p-cliente').textContent = 'Desconocido';
    document.getElementById('p-desc').textContent    = msg.slice(0, 100);
    document.getElementById('p-mat').textContent     = 'PLA';
    document.getElementById('p-notas').textContent   = '—';
    document.getElementById('parsed-result').classList.add('show');
    document.getElementById('step2').style.display = 'block';
  }

  btn.disabled = false;
  btn.innerHTML = '✨ Analizar de nuevo';
};

window.guardarTarea = async function() {
  if (!prioSel) { toast('Seleccioná una prioridad', true); return; }

  const color  = document.getElementById('color').value.trim() || 'Sin especificar';
  const tiempo = document.getElementById('tiempo').value.trim() || 'Sin especificar';

  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  const tarea = {
    cliente:     datosParsed.cliente     || 'Desconocido',
    descripcion: datosParsed.descripcion || '',
    material:    datosParsed.material    || 'PLA',
    notas:       datosParsed.notas       || '',
    color,
    tiempo,
    prioridad:   prioSel,
    estado:      'pendiente',
    creado:      new Date().toLocaleString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }),
    ts:          serverTimestamp()
  };

  try {
    await push(ref(db, 'tareas'), tarea);
    toast('✅ Pedido guardado en el laboratorio');
    setTimeout(() => {
      document.getElementById('mensaje').value = '';
      document.getElementById('color').value   = '';
      document.getElementById('tiempo').value  = '';
      document.getElementById('parsed-result').classList.remove('show');
      document.getElementById('step2').style.display = 'none';
      document.getElementById('btn-save').classList.remove('show');
      document.getElementById('btn-ai').innerHTML = '✨ Analizar con IA';
      datosParsed = {}; prioSel = '';
      ['alta','media','baja'].forEach(x => document.getElementById('prio-'+x).className='prio-btn');
    }, 2000);
  } catch(e) {
    toast('Error al guardar: ' + e.message, true);
  }

  btn.disabled = false;
  btn.textContent = '✅ Guardar pedido';
};
</script>
</body>
</html>
